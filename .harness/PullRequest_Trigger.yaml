inputSet:
  name: Pull Request Trigger
  identifier: Pull_Request_Trigger
  orgIdentifier: PROD
  projectIdentifier: Harness_Commons
  pipeline:
    identifier: dbDevopsPrBuild
    variables:
      - name: TITLE
        type: String
        value: <+trigger.payload.pull_req.title>
      - name: COMMENT
        type: String
        value: <+input>
      - name: PR_NUMBER
        type: String
        value: <+trigger.prNumber>
    properties:
      ci:
        codebase:
          build:
            type: PR
            spec:
              number: <+trigger.prNumber>
